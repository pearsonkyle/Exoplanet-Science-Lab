<!DOCTYPE html><meta charset="utf-8"><title>shader check</title>
<body style="margin:0;background:#000"><canvas id="c" width="900" height="450"></canvas>
<script type="module">
// Compiles the scene shaders the way three.js does (GLSL ES 3.00 with its prefix)
// and draws star + corona + planet with a hand-rolled sphere, without three.js.
import * as SH from '../src/viz/shaders.js';
const gl = document.getElementById('c').getContext('webgl2', { antialias: true });
const VP = `#version 300 es\n#define attribute in\n#define varying out\nprecision highp float;\nuniform mat4 modelMatrix; uniform mat4 modelViewMatrix; uniform mat4 projectionMatrix; uniform mat4 viewMatrix; uniform mat3 normalMatrix; uniform vec3 cameraPosition;\nattribute vec3 position; attribute vec3 normal; attribute vec2 uv;\n`;
const FP = `#version 300 es\n#define varying in\nlayout(location = 0) out highp vec4 pc_fragColor;\n#define gl_FragColor pc_fragColor\nprecision highp float;\nuniform mat4 viewMatrix; uniform vec3 cameraPosition;\n`;
const log = [];
function prog(name, vs, fs) {
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) log.push(name + ' compile: ' + gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VP + vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, FP + fs)); 
  ['position', 'normal', 'uv'].forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) log.push(name + ' link: ' + gl.getProgramInfoLog(p)); else log.push(name + ' ok');
  return p;
}
const P = { star: prog('star', SH.starVert, SH.starFrag), glow: prog('glow', SH.glowVert, SH.glowFrag), planet: prog('planet', SH.planetVert, SH.planetFrag), halo: prog('halo', SH.planetVert, SH.haloFrag), tube: prog('tube', SH.tubeVert, SH.tubeFrag), hz: prog('hz', 'attribute float aAlphaUnused;\n' + SH.hzVert, SH.hzFrag) };
// geometry
function sphere(n, m) { const v = [], idx = []; for (let i = 0; i <= m; i++) for (let j = 0; j <= n; j++) { const th = Math.PI * i / m, ph = 2 * Math.PI * j / n, x = -Math.cos(ph) * Math.sin(th), y = Math.cos(th), z = Math.sin(ph) * Math.sin(th); v.push(x, y, z, x, y, z, j / n, 1 - i / m); } for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) { const a = i * (n + 1) + j, b = a + n + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); } return { v: new Float32Array(v), idx: new Uint16Array(idx) }; }
const quad = { v: new Float32Array([-.5, -.5, 0, 0, 0, 1, 0, 0, .5, -.5, 0, 0, 0, 1, 1, 0, .5, .5, 0, 0, 0, 1, 1, 1, -.5, .5, 0, 0, 0, 1, 0, 1]), idx: new Uint16Array([0, 1, 2, 0, 2, 3]) };
function mesh(g) { const vao = gl.createVertexArray(); gl.bindVertexArray(vao); const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, g.v, gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12); gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24); const e = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, e); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, g.idx, gl.STATIC_DRAW); return { vao, n: g.idx.length }; }
const S = mesh(sphere(96, 64)), Q = mesh(quad);
// camera on +Z looking at origin, orthographic
const ortho = (hw, hh) => new Float32Array([1 / hw, 0, 0, 0, 0, 1 / hh, 0, 0, 0, 0, -0.01, 0, 0, 0, 0, 1]);
function draw(p, m, pos, scale, uni, proj) {
  gl.useProgram(p); const U = (n) => gl.getUniformLocation(p, n);
  const M = new Float32Array([scale, 0, 0, 0, 0, scale, 0, 0, 0, 0, scale, 0, pos[0], pos[1], pos[2], 1]);
  gl.uniformMatrix4fv(U('modelMatrix'), false, M); gl.uniformMatrix4fv(U('modelViewMatrix'), false, M); gl.uniformMatrix4fv(U('projectionMatrix'), false, proj);
  gl.uniformMatrix3fv(U('normalMatrix'), false, new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1])); gl.uniform3f(U('cameraPosition'), 0, 0, 50);
  for (const [k, v] of Object.entries(uni)) { const l = U(k); if (!l) continue; if (typeof v === 'number') gl.uniform1f(l, v); else if (v.length === 3) gl.uniform3fv(l, v); else gl.uniform4fv(l, v); }
  gl.bindVertexArray(m.vao); gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_SHORT, 0);
}
gl.enable(gl.DEPTH_TEST); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
const col = [1, 0.93, 0.82], ld = [0.4939, -0.0729, 0.4578, -0.2158];
const hex = (h) => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];
function view(x0, flat, look, ppos) {
  gl.viewport(x0, 0, 450, 450); const pr = ortho(2.2, 2.2);
  gl.disable(gl.BLEND); gl.depthMask(true);
  draw(P.star, S, [0, 0, 0], 1, { uLD: ld, uColor: col, uTime: 3, uGran: 1, uFlat: flat, uOrtho: 1 }, pr);
  const pu = { uColA: hex(look.a), uColB: hex(look.b), uColC: hex(look.c), uAtmo: hex(look.atmo), uBands: look.bands, uFlat: flat, uSeed: 3.7, uViewDir: [0, 0, 1], uOrtho: 1 };
  draw(P.planet, S, ppos, 0.34, pu, pr);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false);
  if (!flat) { gl.cullFace(gl.FRONT); gl.enable(gl.CULL_FACE); draw(P.halo, S, ppos, 0.34 * 1.09, pu, pr); gl.disable(gl.CULL_FACE);
    draw(P.glow, Q, [0, 0, 0], 4.4, { uColor: [1, 0.86, 0.66], uScale: 4.4, uStrength: 1, uTime: 3 }, pr); }
}
view(0, 0, { a: 0xd9a066, b: 0x8a5a3c, c: 0xf2e0c0, atmo: 0xffc98a, bands: 16 }, [1.45, 0.55, 1.2]);
view(450, 1, { a: 0x6fa8d6, b: 0x3d6ea8, c: 0xd8f0ff, atmo: 0x8fd0ff, bands: 9 }, [0.35, -0.3, 3]);
window.__log = log; document.title = log.join(' | ');
</script></body>
