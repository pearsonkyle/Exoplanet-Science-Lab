[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "exoplanet-science-lab"
dynamic = ["version"]
description = "Exoplanet transit, radial-velocity and timing models with a nested sampler: the numerics of exoplanet.science, from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kyle A. Pearson" }]
keywords = ["exoplanets", "transits", "radial velocity", "nested sampling", "astronomy"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.22",
  "pydantic>=2.5",
  "mini-racer>=0.12",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
quickjs = ["quickjs>=1.19"]
test = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://exoplanet.science"
Documentation = "https://pearsonkyle.github.io/Exoplanet-Science-Lab/docs/reference/python.html"
Source = "https://github.com/pearsonkyle/Exoplanet-Science-Lab"

[project.scripts]
esl = "esl.__main__:main"

[tool.hatch.version]
path = "esl/_version.py"

[tool.hatch.build]
# the generated bundle ships in the wheel whether or not it is committed (hatch would skip git-ignored files)
artifacts = ["esl/_core/esl_core.js", "esl/_core/esl_ld_spectral.js", "esl/_core/manifest.json", "esl/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["esl"]

[tool.hatch.build.targets.sdist]
include = ["esl", "tests", "examples", "README.md", "bundle.manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: fits that take more than a few seconds", "exotic: needs the EXOTIC conda environment"]
