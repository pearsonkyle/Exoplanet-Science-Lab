<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validation has moved · Exoplanet Science Lab</title>
<meta name="robots" content="noindex">
<!-- The Validation page is now the Validation tab of the Methods page. This page keeps old links working: an anchor #x
     becomes #val-x there (the prefix of src/validation/anchors.js; the Methods page falls back to #x when there is no
     #val-x), references and the bibliography keep their names, and no anchor opens the Validation tab. Without
     JavaScript the refresh and the link below lead to that tab. The stored references (public/validation/) are still
     served from this folder. -->
<meta http-equiv="refresh" content="0; url=../methods/#validation">
<script>
(function () {
  var id = decodeURIComponent(location.hash.slice(1));
  var to = !id ? 'validation' : /^(ref-|references$|val-)/.test(id) ? id : 'val-' + id;
  location.replace(new URL('../methods/' + location.search + '#' + encodeURIComponent(to), location.href).href);
})();
</script>
</head>
<body style="background:#05070c;color:#dfe6f3;font:14px/1.5 system-ui,sans-serif;padding:24px">
<p>Validation is now part of Methods: <a href="../methods/#validation" style="color:#5fd4ff">methods/#validation</a>.</p>
</body>
</html>
