# Builds the app and the documentation and publishes them with GitHub Pages: the app at the root, the docs at docs/.
# With a custom domain, set the repository variable PAGES_DOMAIN (e.g. exoplanet.science); see docs/guide/hosting.md.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Where the site lives
        run: |
          if [ -n "${{ vars.PAGES_DOMAIN }}" ]; then
            echo "SITE_URL=https://${{ vars.PAGES_DOMAIN }}/" >> "$GITHUB_ENV"
            echo "DOCS_BASE=/docs/" >> "$GITHUB_ENV"
          else
            repo="${GITHUB_REPOSITORY#*/}"
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo}/" >> "$GITHUB_ENV"
            echo "DOCS_BASE=/${repo}/docs/" >> "$GITHUB_ENV"
          fi
      - run: npm run pages:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
