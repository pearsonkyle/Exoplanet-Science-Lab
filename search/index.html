<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search · Exoplanet Science Lab</title>
<meta name="description" content="Browse known exoplanets and candidates from the NASA Exoplanet Archive, exoplanet.eu and the TESS Objects of Interest, with the source of every value.">
<meta name="esl-root" content="../">
<!-- the site theme before first paint (src/site/theme.js) -->
<script>try{var t=localStorage.getItem('esl.theme');if(t&&t!=='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- opened as a file: browsers do not run the site's modules from file://; say how to open it (docs/guide/getting-started.md) -->
<script>if(location.protocol==='file:')addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.setAttribute('role','alert');d.style.cssText='position:fixed;inset:auto 12px 12px 12px;z-index:999;padding:14px 16px;border-radius:8px;background:#1a2133;color:#dfe6f3;border:1px solid #ffb454;font:14px/1.5 system-ui;max-width:640px';d.innerHTML='<b>This page needs a local web server.</b> Browsers do not run the site\u2019s scripts from a file. In the folder that holds it, run <code>npx serve</code> or <code>python3 -m http.server</code> and open the address it prints (for example http://localhost:8000/).';document.body.appendChild(d)})</script>
<link rel="stylesheet" href="../src/site/site.css">
<link rel="stylesheet" href="../src/search/search.css">
</head>
<body class="page search-page">
<header id="sitebar" data-active="search"></header>
<main id="search-app">
  <div class="s-top">
    <h1>Search</h1>
    <p class="lead" id="s-lead">Known planets and candidates, with the catalogue and reference behind every number. Loading the catalogues…</p>
  </div>
  <div class="s-sources" id="s-sources" aria-label="Catalogues"></div>
  <div class="s-bar">
    <input type="search" id="s-q" placeholder="Name, host, method, facility…" aria-label="Filter by text" autocomplete="off" spellcheck="false">
    <button class="btn" id="s-filters-btn" aria-expanded="false" aria-controls="s-filters">Filters <span class="count" id="s-nfilters"></span></button>
    <button class="btn" id="s-cols-btn" aria-expanded="false" aria-controls="s-cols">Columns</button>
    <label class="s-unit">Planet units <select id="s-units"><option value="earth">Earth</option><option value="jup">Jupiter</option></select></label>
    <label class="s-unit" title="Which catalogue's value is shown when both have one">Show first <select id="s-prefer"><option value="nea">NASA archive</option><option value="eu">exoplanet.eu</option></select></label>
    <label class="s-unit" title="Which period and mid-transit time (always a pair from one solution) the Period, T mid and T unc. columns show: the NASA archive's pair with the smallest predicted uncertainty today, the archive's default parameter set, or exoplanet.eu's. A planet without the chosen one is marked †.">Ephemeris <select id="s-eph"><option value="best">NASA best-timed</option><option value="default">NASA archive default</option><option value="eu">exoplanet.eu</option></select></label>
    <span class="s-count" id="s-count" aria-live="polite"></span>
    <button class="btn" id="s-csv" title="Download the rows that pass the filters, with the columns on show">Export CSV</button>
  </div>
  <div class="s-pop" id="s-cols" hidden></div>
  <div class="s-filters" id="s-filters" hidden></div>
  <div class="s-legend" id="s-legend"></div>
  <div class="s-main">
    <div class="vt" id="s-table" tabindex="0" role="grid" aria-label="Planets and candidates"></div>
    <aside class="s-detail" id="s-detail" hidden aria-label="Details"></aside>
  </div>
  <p class="note" id="s-foot"></p>
</main>
<script type="module" src="../src/site/nav.js"></script>
<script type="module" src="../src/search/main.js"></script>
</body>
</html>
